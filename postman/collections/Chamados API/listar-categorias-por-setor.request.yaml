$kind: http-request
name: Listar categorías por setor
method: GET
url: '{{base_url}}/setores/{{setor_id}}/categorias'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status 200', () => {
        pm.response.to.have.status(200);
      });
      pm.test('Lista de categorías', () => {
        pm.expect(pm.response.json()).to.be.an('array');
      });
